[package]
name = "openmusix"
version = "0.1.0"
description = "Synced lyrics overlay for streamers"
authors = ["OpenMusix contributors"]
edition = "2024"
repository = "https://github.com/Ltfrzky/OpenMusix"

[lib]
name = "openmusix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
font-kit = "0.14"
lindera = { version = "=7.0.0", default-features = false, features = ["mmap"] }
wana_kana = "=5.0.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
mpris = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-tungstenite = "0.27"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
